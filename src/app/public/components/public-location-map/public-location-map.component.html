<section aria-label="Mapa de recolección" class="overflow-hidden rounded-3xl border
             border-base-300 bg-base-100 shadow-sm">
  <div class="flex flex-wrap items-start justify-between
               gap-4 p-5 sm:p-6">
    <div class="min-w-0">
      <h2 class="text-lg font-bold">
        Seguimiento del vehículo
      </h2>

      @if (nombreRuta) {
      <p class="mt-1 text-sm text-base-content/60">
        {{ nombreRuta }}
      </p>
      }
    </div>

    <button type="button" class="btn btn-ghost btn-sm" [disabled]="cargando" (click)="actualizar.emit()">
      @if (cargando) {
      <span class="loading loading-spinner loading-xs"></span>
      } @else {
      <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
      }

      Actualizar
    </button>
  </div>

  <div class="relative min-h-72 border-y
               border-base-300 bg-base-200 sm:min-h-96">
    <!-- La página puede proyectar aquí el mapa real. -->
    <div [hidden]="!mapaIntegrado">
      <ng-content select="[mapa]" />
    </div>

    @if (!mapaIntegrado) {
    <div class="flex min-h-72 items-center justify-center
                   px-6 py-10 sm:min-h-96">
      <div class="max-w-sm text-center">
        <div class="mx-auto flex size-16 items-center justify-center
                       rounded-2xl bg-base-100 text-2xl
                       text-primary shadow-sm">
          <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
        </div>

        <h3 class="mt-4 font-bold">
          {{ tituloVacio }}
        </h3>

        <p class="mt-2 text-sm leading-6 text-base-content/65">
          {{ mensajeVacio }}
        </p>
      </div>
    </div>
    }

    @if (cargando) {
    <div class="absolute inset-x-0 top-0" role="status" aria-label="Actualizando ubicación">
      <progress class="progress progress-primary block w-full"></progress>
    </div>
    }
  </div>

  <div class="space-y-3 p-5">
    @if (mensajeUbicacion) {
    <p class="text-sm leading-6 text-base-content/70" aria-live="polite">
      {{ mensajeUbicacion }}
    </p>
    }

    <app-public-last-update [fecha]="ultimaActualizacion" [desactualizada]="desactualizada" />

    <p class="flex items-start gap-2 text-xs leading-5 text-base-content/55">
      <i class="fa-solid fa-circle-info mt-1 shrink-0" aria-hidden="true"></i>

      <span>
        La ubicación del vehículo es aproximada y se publica
        durante el recorrido autorizado.
      </span>
    </p>
  </div>
</section>
