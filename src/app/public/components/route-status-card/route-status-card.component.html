 <section
      aria-label="Estado del recorrido"
      class="rounded-3xl border border-base-300
             bg-base-100 p-5 shadow-sm sm:p-6"
    >
      <p class="text-sm font-semibold text-base-content/60">
        Estado del recorrido
      </p>

      @if (nombreRuta) {
        <h2 class="mt-1 text-lg font-bold">
          {{ nombreRuta }}
        </h2>
      }

      <div class="mt-4 flex items-start gap-3" aria-live="polite">
        <div
          class="flex size-11 shrink-0 items-center
                 justify-center rounded-2xl"
          [class]="presentacion.clase"
        >
          <i [class]="presentacion.icono" aria-hidden="true"></i>
        </div>

        <div>
          <p class="font-bold">
            {{ presentacion.etiqueta }}
          </p>

          <p class="mt-1 text-sm leading-6 text-base-content/65">
            {{ mensaje || presentacion.mensaje }}
          </p>
        </div>
      </div>

      @if (incidenciaPublica) {
        <div
          class="mt-5 rounded-2xl border border-warning/25
                 bg-warning/10 p-4"
        >
          <p class="text-sm font-semibold">
            Aviso del servicio
          </p>

          <p class="mt-1 text-sm leading-6">
            {{ incidenciaPublica }}
          </p>
        </div>
      }
    </section>
