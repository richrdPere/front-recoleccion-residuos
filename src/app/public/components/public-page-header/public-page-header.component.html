<header class="mb-7">
      @if (etiqueta) {
        <div
          class="mb-3 inline-flex items-center gap-2 rounded-full
                 bg-primary/10 px-3 py-1.5 text-xs font-semibold
                 text-primary"
        >
          <i [class]="icono" aria-hidden="true"></i>
          {{ etiqueta }}
        </div>
      }

      <h1
        class="text-2xl font-bold tracking-tight
               text-base-content sm:text-3xl"
      >
        {{ titulo }}
      </h1>

      @if (descripcion) {
        <p
          class="mt-2 max-w-2xl text-sm leading-6
                 text-base-content/65"
        >
          {{ descripcion }}
        </p>
      }

      <ng-content />
    </header>
