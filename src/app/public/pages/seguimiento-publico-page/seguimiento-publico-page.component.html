<div class="mx-auto max-w-7xl px-4 py-7 sm:px-6 lg:px-8">

      <app-public-page-header
        titulo="Seguimiento de recolección"
        descripcion="Selecciona una ruta para consultar su estado y la ubicación disponible."
        etiqueta="Estado del servicio"
        icono="fa-solid fa-truck"
      />

      <p
        role="note"
        class="mb-6 rounded-2xl bg-warning/10 p-4 text-sm leading-6"
      >
        Vista de demostración. El estado y el GPS se conectarán al backend.
      </p>

      <app-sector-information-card
        [nombre]="ruta().sector"
        [rutas]="rutas"
        [idRutaSeleccionada]="idRuta()"
        (rutaSeleccionada)="seleccionarRuta($event)"
      />

      <div class="mt-6 grid items-start gap-6 lg:grid-cols-3">
        <aside class="space-y-6">
          <app-route-status-card
            [nombreRuta]="ruta().nombre"
            estado="SIN_SERVICIO_ACTIVO"
          />

          <div
            class="rounded-3xl border border-base-300 bg-base-100 p-5"
          >
            <h2 class="font-bold">
              Acerca del seguimiento
            </h2>

            <p class="mt-3 text-sm leading-6 text-base-content/65">
              Durante un recorrido activo se mostrará la ubicación
              aproximada del vehículo y la fecha de su última posición.
            </p>

            <p class="mt-3 text-sm leading-6 text-base-content/65">
              La disponibilidad depende de la conexión y de las
              posiciones recibidas desde el vehículo.
            </p>
          </div>
        </aside>

        <div class="lg:col-span-2">
          <app-public-location-map
            [nombreRuta]="ruta().nombre"
            tituloVacio="Seguimiento pendiente de conexión"
            mensajeVacio="Este espacio mostrará el mapa de la ruta seleccionada."
            [mensajeUbicacion]="mensaje()"
            (actualizar)="actualizar()"
          />
        </div>
      </div>
    </div>
