<div class="min-h-screen bg-base-200 flex items-center justify-center px-4">

  <div class="card w-full max-w-lg bg-base-100 shadow-xl">

    <div class="card-body items-center text-center">

      <!-- Icono -->
      <div class="w-24 h-24 rounded-full bg-error/10 flex items-center justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 text-error" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0
               9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
      </div>

      <span class="badge badge-error badge-outline mb-2">
        Código 403
      </span>

      <h1 class="text-3xl font-bold text-base-content">
        Acceso denegado
      </h1>

      <p class="mt-3 text-base-content/70 max-w-md">
        Tu cuenta se encuentra autenticada, pero no posee los permisos
        necesarios para acceder a este módulo del sistema.
      </p>

      <div class="alert alert-warning mt-6 text-left">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86
               c1.54 0 2.5-1.667 1.73-3L13.73 4
               c-.77-1.333-2.69-1.333-3.46 0L3.34 16
               c-.77 1.333.19 3 1.73 3z" />
        </svg>

        <span>
          Comunícate con el administrador si consideras que deberías tener
          acceso a esta sección.
        </span>
      </div>

      <div class="card-actions justify-center mt-7 flex-wrap">

        <button type="button" class="btn btn-outline" (click)="volver()">
          Volver
        </button>

        <button type="button" class="btn btn-primary" (click)="irAlInicio()">
          Ir al panel principal
        </button>

        <button type="button" class="btn btn-ghost text-error" (click)="cerrarSesion()">
          Cerrar sesión
        </button>

      </div>

    </div>

  </div>

</div>
