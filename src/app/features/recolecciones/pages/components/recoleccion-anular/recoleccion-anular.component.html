@if (mostrarModal) {
<div class="modal modal-open">
  <section class="modal-box w-11/12 max-w-xl" role="dialog" aria-modal="true"
    aria-labelledby="recoleccion-anular-titulo" [attr.aria-busy]="isSaving" (keydown.escape)="cerrarModal()">
    <!-- ENCABEZADO -->
    <header class="flex items-start justify-between gap-4
               border-b border-base-300 pb-4">
      <div>
        <h2 id="recoleccion-anular-titulo" class="text-xl font-bold">
          <i class="fa-solid fa-ban mr-2 text-error" aria-hidden="true"></i>
          Anular recolección
        </h2>

        <p class="mt-1 text-sm text-base-content/60">
          Indica el motivo de la anulación.
        </p>

        <span class="badge badge-outline mt-2">
          Recolección #{{ idRecoleccion }}
        </span>
      </div>

      <button type="button" class="btn btn-sm btn-circle btn-ghost" aria-label="Cerrar formulario" [disabled]="isSaving"
        (click)="cerrarModal()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <!-- FORMULARIO -->
    <form [formGroup]="form" (ngSubmit)="anularRecoleccion()" class="mt-5 space-y-5">
      @if (errorFormulario) {
      <div class="alert alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>

        <span>{{ errorFormulario }}</span>
      </div>
      }

      <div>
        <label for="recoleccion-motivo-anulacion" class="mb-2 block text-sm font-semibold">
          Motivo de anulación
          <span class="text-error">*</span>
        </label>

        <textarea id="recoleccion-motivo-anulacion" formControlName="motivo_anulacion"
          class="textarea textarea-bordered w-full" rows="5" placeholder="Describe por qué se anula esta recolección..."
          [class.textarea-error]="motivoInvalido" [attr.aria-invalid]="motivoInvalido"
          aria-describedby="recoleccion-motivo-ayuda"></textarea>

        <p id="recoleccion-motivo-ayuda" class="mt-1 text-xs" [class.text-error]="motivoInvalido"
          [class.text-base-content/60]="!motivoInvalido">
          {{
          motivoInvalido
          ? 'Ingresa un motivo válido; no puede contener solo espacios.'
          : 'Este motivo quedará asociado a la anulación.'
          }}
        </p>
      </div>

      <!-- BOTONES -->
      <footer class="flex justify-end gap-3
                 border-t border-base-300 pt-4">
        <button type="button" class="btn" [disabled]="isSaving" (click)="cerrarModal()">
          Cancelar
        </button>

        <button type="submit" class="btn btn-error" [disabled]="isSaving">
          @if (isSaving) {
          <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
          Procesando...
          } @else {
          <i class="fa-solid fa-ban" aria-hidden="true"></i>
          Anular recolección
          }
        </button>
      </footer>
    </form>
  </section>

  <div class="modal-backdrop" aria-hidden="true">
    <button type="button" tabindex="-1" aria-label="Cerrar" [disabled]="isSaving" (click)="cerrarModal()">
      Cerrar
    </button>
  </div>
</div>
}
