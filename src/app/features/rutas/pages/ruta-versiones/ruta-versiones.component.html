<!-- MODALES -->
<ruta-version-form [mostrarModal]="mostrarModalVersionForm" [ruta_id]="ruta_id"
  (modalCerrado)="mostrarModalVersionForm = false" (versionCreada)="cargarVersiones()"></ruta-version-form>

@if (mostrarModal) {
<div class="modal modal-open">
  <section class="modal-box w-11/12 max-w-6xl" role="dialog" aria-modal="true" aria-labelledby="ruta-versiones-titulo"
    [attr.aria-busy]="cargando()" (keydown.escape)="cerrarModal()">
    <!-- ENCABEZADO -->
    <header class="flex items-start justify-between gap-4 border-b
               border-base-300 pb-4">
      <div>
        <h2 id="ruta-versiones-titulo" class="text-xl font-bold">
          <i class="fa-solid fa-code-branch mr-2 text-primary" aria-hidden="true"></i>
          Versiones de ruta
        </h2>

        <button type="button" class="btn btn-primary btn-sm" [disabled]="cargando()" (click)="abrirVersionForm()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          Crear versión
        </button>

        <p class="mt-1 text-sm text-base-content/60">
          Consulta las versiones y sus puntos registrados.
        </p>

        <span class="badge badge-outline mt-2">
          Ruta #{{ ruta_id }}
        </span>
      </div>

      <button type="button" class="btn btn-sm btn-circle btn-ghost" aria-label="Cerrar versiones de ruta"
        (click)="cerrarModal()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>




    <!-- CONTENIDO -->
    <ruta-puntos [version]="versionSeleccionada()" (crearPunto)="abrirCrearPunto($event)"
      (editarPunto)="abrirEditarPunto($event)" (puntosActualizados)="cargarVersiones()"></ruta-puntos>



    <!-- PIE -->
    <footer class="flex justify-end border-t border-base-300 pt-4">
      <button type="button" class="btn" (click)="cerrarModal()">
        Cerrar
      </button>
    </footer>
  </section>

  <div class="modal-backdrop" aria-hidden="true">
    <button type="button" tabindex="-1" aria-label="Cerrar" (click)="cerrarModal()">
      Cerrar
    </button>
  </div>
</div>
}
