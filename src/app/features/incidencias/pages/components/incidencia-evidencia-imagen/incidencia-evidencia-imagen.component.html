@if (cargando()) {
<p class="text-sm text-base-content/60">
  Cargando evidencia…
</p>
}

@if (errorMensaje()) {
<p class="text-sm text-error" role="alert">
  {{ errorMensaje() }}
</p>
}

@if (imagenUrl(); as url) {
<img [src]="url" [alt]="descripcion" class="max-h-96 w-full rounded-xl object-contain" />
}
